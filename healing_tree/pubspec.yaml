name: healing_tree
description: AI-based emotional care diary app - Your personal healing companion
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^12.1.3

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.5
  fl_chart: ^0.65.0
  flutter_svg: ^2.0.9

  # Networking
  dio: ^5.4.0
  http: ^1.1.2

  # JSON Serialization
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6

  # Authentication
  google_sign_in: ^6.2.1
  local_auth: ^2.1.8

  # Utilities
  uuid: ^4.3.3
  share_plus: ^7.2.1
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Speech to Text
  speech_to_text: ^6.5.1

  # Location & Weather
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1

  # Animations
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  freezed: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
